name: CI & Deploy

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nutriplan
          POSTGRES_USER: nutriplan
          POSTGRES_PASSWORD: nutriplan
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: nutriplan.settings.development
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://nutriplan:nutriplan@localhost:5432/nutriplan
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      FIREBASE_CREDENTIALS_JSON: ""
      FIREBASE_CREDENTIALS_PATH: ""
      OPENAI_API_KEY: ""
      USDA_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint — ruff
        run: ruff check .

      - name: Lint — black
        run: black --check .

      - name: Lint — mypy
        run: mypy apps/ core/

      - name: Test with coverage
        run: pytest --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  deploy:
    name: Deploy → GCP VM
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/nutri-app-backend
            git pull
            docker-compose up -d --build
            echo "✅ Deploy complete"

      - name: Health Check (with retries)
        run: |
          echo "Waiting for server to be ready..."
          for i in $(seq 1 6); do
            sleep 15
            echo "Attempt $i/6..."
            if curl -sf http://${{ secrets.GCP_HOST }}/healthz | grep -q '"status": "ok"'; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Not ready yet, retrying..."
          done
          echo "❌ Health check failed after 90 seconds"
          exit 1
