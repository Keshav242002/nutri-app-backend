name: Deploy to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy → GCP VM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/nutri-app-backend
            git pull
            docker-compose up -d --build
            echo "✅ Deploy complete"

      - name: Health Check
        run: |
          sleep 15
          RESPONSE=$(curl -sf http://${{ secrets.GCP_HOST }}/healthz)
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status": "ok"' && echo "✅ Health check passed" || (echo "❌ Health check failed" && exit 1)
